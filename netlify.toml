# kimonoceo.com（HiMaWaRi合同会社）。ビルド無しで、このリポジトリの最上位をそのまま公開する。
# 転送ルールは _redirects、ヘッダーは _headers。毎月書き換える値は index.html 冒頭の ADVISORY_LEFT（今月の残り枠）。
[build]
  publish = "."
  command = ""

# Instagram横スライドの画像を作る関数（/ig/slide.jpg）。2026-10-25追加
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["@resvg/resvg-js"]
  included_files = ["netlify/functions/igslide/fonts/*"]
