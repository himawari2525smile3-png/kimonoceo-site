<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>note見出し画像</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&display=block" rel="stylesheet">
<style>
  :root{--navy:#0F1B3D;--gold:#C9A227}
  html,body{margin:0;background:#0b1430;color:#e9e3cf;font-family:"Hiragino Sans","Noto Sans JP",Meiryo,sans-serif}
  main{max-width:900px;margin:0 auto;padding:16px}
  img{display:block;width:100%;height:auto;border:1px solid #2a365c}
  .bar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
  a.btn{flex:1;min-width:200px;text-align:center;padding:14px 10px;border-radius:999px;background:var(--gold);color:var(--navy);font-weight:700;text-decoration:none}
  p{font-size:13px;line-height:1.8;color:#b9b3a0}
</style>
</head>
<body>
<main>
  <img id="out" alt="note見出し画像">
  <div class="bar"><a id="dl" class="btn" download="note.png" href="#">画像を保存する</a></div>
  <p>スマホでは画像を長押しして「画像を保存」でも保存できます。サイズは1280×670（noteの見出し画像の推奨サイズ）です。</p>
</main>
<canvas id="c" width="1280" height="670" hidden></canvas>
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  const l1 = q.get('l1') || '';            // 1行目（白）
  const l2 = q.get('l2') || '';            // 2行目（金）
  const sig = q.get('sig') || 'AI時代の経営者専属顧問　飯村 惇';
  const name = q.get('name') || 'note';
  const W = 1280, H = 670, NAVY = '#0F1B3D', GOLD = '#C9A227', GOLD2 = '#D8B566', WHITE = '#F6F1E3';
  const FONT = '"Shippori Mincho B1","Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif';
  try { await Promise.all([document.fonts.load(`800 48px "Shippori Mincho B1"`, l1 + l2 + sig), document.fonts.load(`700 20px "Shippori Mincho B1"`, sig)]); } catch (e) {}
  const c = document.getElementById('c'), x = c.getContext('2d');

  // 地
  x.fillStyle = NAVY; x.fillRect(0, 0, W, H);

  // 青海波（上下に薄く）
  function seigaiha(y0, h, alpha, fadeDown) {
    x.save(); x.beginPath(); x.rect(0, y0, W, h); x.clip();
    const r = 18, step = r * 2;
    for (let row = -1; row * (r / 2) < h + r; row++) {
      const y = y0 + row * (r / 2);
      const off = (row % 2) ? r : 0;
      const t = Math.min(1, Math.max(0, (y - y0) / h));
      x.globalAlpha = alpha * (fadeDown ? (1 - t) : t);
      for (let cx = -step + off; cx < W + step; cx += step) {
        for (let k = 3; k >= 1; k--) {
          x.beginPath(); x.arc(cx, y + r, r * k / 3, Math.PI, 0);
          x.strokeStyle = '#3A4E86'; x.lineWidth = 1; x.stroke();
        }
      }
    }
    x.restore(); x.globalAlpha = 1;
  }
  seigaiha(0, 34, 0.55, true);
  seigaiha(H - 34, 34, 0.55, false);

  // 枠
  x.strokeStyle = 'rgba(201,162,39,.75)'; x.lineWidth = 1.2;
  x.strokeRect(35.5, 35.5, W - 71, H - 71);
  x.fillStyle = NAVY; x.fillRect(36.5, 36.5, W - 73, H - 73);

  // 文字の大きさ（枠内に収まるよう自動で縮める）
  const maxW = W - 220;
  function fit(text, size, weight) {
    let s = size; x.font = `${weight} ${s}px ${FONT}`;
    while (x.measureText(text).width > maxW && s > 24) { s -= 1; x.font = `${weight} ${s}px ${FONT}`; }
    return s;
  }
  const s1 = l1 ? fit(l1, 50, 800) : 0;
  const s2 = l2 ? fit(l2, 52, 800) : 0;
  const gap = 34, lines = [l1 && [l1, s1, WHITE], l2 && [l2, s2, GOLD2]].filter(Boolean);
  const blockH = lines.reduce((a, l) => a + l[1], 0) + gap * (lines.length - 1);
  let y = H / 2 + 6 - blockH / 2;

  // 金の短い線（上）
  const rule = (yy) => { x.strokeStyle = 'rgba(201,162,39,.85)'; x.lineWidth = 1.2; x.beginPath(); x.moveTo(W / 2 - 32, yy); x.lineTo(W / 2 + 32, yy); x.stroke(); };
  rule(y - 62);

  x.textAlign = 'center'; x.textBaseline = 'top';
  for (const [t, s, col] of lines) {
    x.font = `800 ${s}px ${FONT}`; x.fillStyle = col;
    x.fillText(t, W / 2, y); y += s + gap;
  }
  rule(y - gap + 62);

  // 署名
  x.font = `700 19px ${FONT}`; x.fillStyle = GOLD;
  if ('letterSpacing' in x) x.letterSpacing = '4px';
  x.fillText(sig, W / 2, H - 92);

  const url = c.toDataURL('image/png');
  const img = document.getElementById('out'); img.src = url;
  const dl = document.getElementById('dl'); dl.href = url; dl.download = name + '.png';
  document.title = 'note見出し画像 ' + (l1 + l2).slice(0, 20);
  window.__done = true;
})();
</script>
</body>
</html>
